<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>¿Me perdonas?</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --green:#28a745;
      --red:#dc3545;
    }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,var(--bg),#2400f3 60%);
      color:var(--text);
      padding:24px;
    }

    .hide {
  display: none;
}

    .card{
      background:var(--card);
      border-radius:12px;
      box-shadow:0 8px 30px rgba(17,24,39,0.08);
      padding:28px;
      width:100%;
      max-width:520px;
      text-align:center;
      position:relative;
    }
    h1{margin:0 0 16px 0;font-size:28px;}
    p.prompt{margin:0 0 22px 0;font-size:18px;color:#334155;}
    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:18px;
      flex-wrap:wrap;
    }
    button{
      padding:12px 20px;
      font-size:16px;
      border-radius:10px;
      border:0;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(2,6,23,0.06);
      transition:transform .12s ease, opacity .12s ease;
      min-width:110px;
    }
    button:active{transform:translateY(2px);}
    #yesBtn{background:var(--green);color:white;}
    #noBtn{background:var(--red);color:white;}
    .kitten{
      margin-top:12px;
      display:none;
      flex-direction:column;
      align-items:center;
      gap:10px;
      animation:pop .25s ease;
    }
    .kitten iframe{
      width:100%;
      height:550px;
      border-radius:12px;
      border:none;
      box-shadow:0 8px 22px rgba(2,6,23,0.08);
    }
    .small{font-size:14px;color:#64748b;}
    .topCat{width:200px;margin:0 auto 18px auto;transition:transform .3s ease;}
    .topCat img{
      width:100%;
      border-radius:12px;
      box-shadow:0 6px 16px rgba(0,0,0,0.1);
    }
    @keyframes pop{
      from{transform:scale(.98);opacity:0}
      to{transform:scale(1);opacity:1}
    }
    @media (max-width:420px){
      button{min-width:90px;padding:10px;font-size:15px;}
      h1{font-size:22px;}
      .kitten iframe{height:400px;}
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="title">
    <div class="topCat" id="topCat">
      <img id="topCatImg" alt="Gatito triste" src="https://cdn2.thecatapi.com/images/MTY3ODIyMQ.jpg">
    </div>

    <h1 id="title">¿Me perdonas?</h1>
    <p class="prompt" id="promptText"></p>

    <div class="buttons" id="buttonsRow">
      <button id="yesBtn" aria-label="Sí">Sí</button>
      <button id="noBtn" aria-label="No">No</button>
    </div>

    <div class="kitten" id="kittenBox" aria-live="polite">
      <!-- Aquí aparecerá el video de TikTok -->
      <iframe id="tiktokFrame" allowfullscreen></iframe>
      <div class="small">Graciaaaaas mejorare</div>
    </div>
